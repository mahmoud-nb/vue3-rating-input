name: "🚀 release"

on:
    push:
        branches:
          - master

# Cancel superseded runs on the same ref, but never mid-publish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write        # push the "Version Packages" PR / tags
    pull-requests: write   # open and update the release PR

jobs:
    release:
        name: 🚀 release
        runs-on: ubuntu-latest
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🟢 node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.22.2
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: 📦 install
              run: npm ci

            - name: ✅ test
              run: npm test -- --run

            # When changesets are pending -> opens/updates a "Version Packages" PR.
            # When that PR is merged (no changesets left) -> runs `release` to build & publish.
            - name: 🚀 version or publish
              uses: changesets/action@v1
              with:
                  version: npm run version
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
